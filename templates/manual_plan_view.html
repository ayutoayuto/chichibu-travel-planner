<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        旅のしおり | 秩父旅行プランナー
    </title>


    <style>

        *{
            box-sizing:border-box;
        }


        body{

            margin:0;

            background:#f4f1e9;

            color:#20352d;

            font-family:
                "Yu Gothic",
                "Hiragino Kaku Gothic ProN",
                Meiryo,
                sans-serif;
        }


        a{
            color:inherit;

            text-decoration:none;
        }


        button{
            font:inherit;

            cursor:pointer;
        }


        /* =====================================================
           HERO
        ====================================================== */

        .view-hero{

            position:relative;

            min-height:360px;

            display:flex;

            align-items:center;


            color:#fff;


            background:

                linear-gradient(
                    90deg,
                    rgba(8,35,28,.96),
                    rgba(8,35,28,.65),
                    rgba(8,35,28,.2)
                ),

                url(
                    "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=85"
                );


            background-size:cover;

            background-position:center;
        }


        .nav{

            position:absolute;

            right:28px;

            top:24px;


            display:flex;

            gap:8px;

            flex-wrap:wrap;
        }


        .nav a,
        .nav button{

            padding:
                10px
                14px;


            border:
                1px solid
                rgba(255,255,255,.35);


            border-radius:999px;


            background:
                rgba(8,35,28,.42);


            color:#fff;


            font-size:10px;

            font-weight:700;
        }


        .nav a:hover,
        .nav button:hover{

            background:#9a8252;

            border-color:#9a8252;
        }


        .hero-in{

            width:
                min(
                    1050px,
                    90%
                );


            margin:auto;


            padding:
                70px
                0
                50px;
        }


        .label{

            color:#d9c58b;


            font-size:9px;

            font-weight:800;


            letter-spacing:3px;
        }


        .hero-in h1{

            margin:
                15px
                0
                15px;


            font-family:
                Georgia,
                "Yu Mincho",
                serif;


            font-size:
                clamp(
                    42px,
                    6vw,
                    70px
                );


            font-weight:400;
        }


        .hero-in p{

            margin:0;


            color:
                rgba(255,255,255,.8);


            line-height:1.9;


            font-size:12px;
        }


        /* =====================================================
           MAIN
        ====================================================== */

        main{

            width:
                min(
                    1050px,
                    92%
                );


            margin:auto;


            padding:
                55px
                0
                90px;
        }


        /* =====================================================
           OVERVIEW
        ====================================================== */

        .overview{

            display:grid;


            grid-template-columns:
                repeat(
                    4,
                    1fr
                );


            gap:12px;


            margin-bottom:45px;
        }


        .overview div{

            padding:18px;


            background:#fff;


            border-radius:12px;


            box-shadow:
                0 10px 30px
                rgba(25,45,35,.06);
        }


        .overview small{

            display:block;


            margin-bottom:6px;


            color:#9a8252;


            font-size:8px;


            letter-spacing:1.4px;
        }


        .overview strong{

            font-size:12px;
        }


        /* =====================================================
           TRIP MEMO
        ====================================================== */

        .trip-note{

            margin-bottom:45px;


            padding:
                22px
                24px;


            border-left:
                4px solid
                #9a8252;


            background:#fff;
        }


        .trip-note small{

            color:#9a8252;


            font-size:8px;

            font-weight:800;


            letter-spacing:2px;
        }


        .trip-note p{

            margin:
                9px
                0
                0;


            color:#68746e;


            font-size:12px;


            line-height:1.9;


            white-space:
                pre-line;
        }


        /* =====================================================
           DAY
        ====================================================== */

        .day{

            margin-bottom:48px;
        }


        .day-head{

            display:flex;

            align-items:end;

            justify-content:space-between;


            gap:15px;


            margin-bottom:18px;
        }


        .day-head h2{

            margin:
                5px
                0
                0;


            font-family:
                Georgia,
                serif;


            font-size:34px;


            font-weight:400;
        }


        .day-date{

            color:#8d948f;


            font-size:11px;
        }


        /* =====================================================
           TIMELINE
        ====================================================== */

        .timeline{

            position:relative;
        }


        .timeline::before{

            content:"";


            position:absolute;


            left:70px;

            top:15px;

            bottom:15px;


            width:1px;


            background:#d8d0c2;
        }


        .item{

            position:relative;


            display:grid;


            grid-template-columns:
                55px
                1fr;


            gap:28px;


            margin-bottom:14px;
        }


        .time{

            padding-top:22px;


            color:#9a8252;


            font-family:
                Georgia,
                serif;


            font-size:14px;


            text-align:right;
        }


        /* =====================================================
           CARD
        ====================================================== */

        .card{

            position:relative;


            padding:
                22px
                24px;


            background:#fff;


            border-radius:16px;


            box-shadow:
                0 12px 35px
                rgba(25,45,35,.06);
        }


        .card::before{

            content:"";


            position:absolute;


            left:-34px;

            top:27px;


            width:11px;

            height:11px;


            border:
                3px solid
                #f4f1e9;


            border-radius:50%;


            background:#9a8252;
        }


        .type{

            color:#9a8252;


            font-size:8px;

            font-weight:800;


            letter-spacing:1.5px;
        }


        .card h3{

            margin:
                6px
                0;


            font-family:
                Georgia,
                "Yu Mincho",
                serif;


            font-size:22px;


            font-weight:400;
        }


        .role{

            display:inline-block;


            margin-top:3px;


            padding:
                5px
                8px;


            border-radius:999px;


            background:#f2eee5;


            color:#695f49;


            font-size:8px;
        }


        .memo{

            margin:
                12px
                0
                0;


            color:#6c7771;


            font-size:10px;


            line-height:1.8;
        }


        .maps{

            display:inline-block;


            margin-top:12px;


            color:#8f7545;


            font-size:9px;

            font-weight:800;
        }


        .empty{

            padding:22px;


            border:
                1px dashed
                #d6cebf;


            border-radius:12px;


            color:#828985;


            text-align:center;


            font-size:10px;
        }


        /* =====================================================
           ACTIONS
        ====================================================== */

        .actions{

            display:grid;


            grid-template-columns:
                1fr
                1fr
                1fr;


            gap:10px;


            margin-top:45px;
        }


        .actions a,
        .actions button{

            padding:14px;


            border-radius:12px;


            text-align:center;


            font-size:11px;

            font-weight:800;
        }


        .primary{

            border:0;


            background:#18392f;


            color:#fff;
        }


        .primary:hover{

            background:#9a8252;
        }


        .secondary{

            border:
                1px solid
                #d6cebf;


            background:#fff;


            color:#405049;
        }


        /* =====================================================
           SMARTPHONE
        ====================================================== */

        @media(
            max-width:700px
        ){

            .nav{

                position:relative;


                top:auto;

                right:auto;


                padding:12px;


                background:#18392f;
            }


            .view-hero{

                min-height:290px;
            }


            .hero-in{

                padding:
                    45px
                    0;
            }


            .overview{

                grid-template-columns:
                    1fr
                    1fr;
            }


            .timeline::before{

                left:46px;
            }


            .item{

                grid-template-columns:
                    35px
                    1fr;


                gap:24px;
            }


            .time{

                font-size:10px;
            }


            .card::before{

                left:-30px;
            }


            .actions{

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<header class="view-hero">


    <nav class="nav">

        <a href="/">
            HOME
        </a>

        <a href="/history">
            ▣ 履歴
        </a>

        <a
            id="editTop"
            href="/manual-plan"
        >
            ✎ 編集
        </a>

    </nav>


    <div class="hero-in">


        <div class="label">

            MY CHICHIBU ITINERARY

        </div>


        <h1 id="title">

            旅のしおり

        </h1>


        <p id="sub">
        </p>


    </div>


</header>



<main>


    <!-- 基本情報 -->

    <section
        class="overview"
        id="overview"
    >
    </section>



    <!-- 全体メモ -->

    <section
        class="trip-note"
        id="tripNote"
        hidden
    >

        <small>
            TRIP MEMO
        </small>

        <p>
        </p>

    </section>



    <!-- DAY -->

    <div id="days">
    </div>



    <!-- ボタン -->

    <div class="actions">


        <a
            class="secondary"
            id="editBottom"
            href="/manual-plan"
        >
            ✎ このプランを編集
        </a>


        <button
            type="button"
            class="secondary"
            id="tripBookButton"
        >
            ▤ TRIP BOOKを作る
        </button>


        <a
            class="primary"
            href="/history"
        >
            旅行プラン履歴へ
        </a>


    </div>


</main>



<script
    src="{{ url_for('static', filename='manual_plan_view.js') }}"
></script>


</body>

</html>
