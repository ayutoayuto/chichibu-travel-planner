<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お気に入り | 秩父旅行プランナー</title>

    <style>
        *{box-sizing:border-box;}
        body{
            margin:0;
            background:#f4f1e9;
            color:#20352d;
            font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
        }
        a{color:inherit;}

        .favorite-page-hero{
            min-height:300px;
            display:flex;
            align-items:center;
            position:relative;
            color:#fff;
            background:linear-gradient(135deg,#18392f 0%,#0c211a 100%);
        }

        .favorite-page-hero-inner{
            width:min(1100px,90%);
            margin:0 auto;
            padding:62px 0;
        }

        .favorite-page-label{
            margin-bottom:14px;
            color:#d9c58b;
            font-size:10px;
            letter-spacing:4px;
            font-weight:700;
        }

        .favorite-page-hero h1{
            margin:0 0 14px;
            font-family:Georgia,serif;
            font-size:clamp(42px,6vw,70px);
            line-height:1.1;
            font-weight:400;
        }

        .favorite-page-hero h1 span{
            color:#dcc98e;
        }

        .favorite-page-hero p{
            margin:0;
            color:rgba(255,255,255,.82);
            line-height:1.9;
            font-size:13px;
        }

        .back-plan-link{
            position:absolute;
            top:24px;
            right:28px;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:10px 16px;
            border:1px solid rgba(255,255,255,.35);
            border-radius:999px;
            background:rgba(8,35,28,.42);
            color:#fff;
            text-decoration:none;
            font-size:11px;
            font-weight:700;
            backdrop-filter:blur(8px);
            transition:.25s;
        }

        .back-plan-link:hover{
            background:#9a8252;
            border-color:#9a8252;
        }

        .favorite-top-nav{
            position:absolute;
            top:24px;
            right:28px;
            display:flex;
            flex-direction:column;
            align-items:flex-end;
            gap:8px;
            z-index:20;
        }

        .favorite-top-nav .back-plan-link{
            position:static;
        }

        .favorite-history-link{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:10px 16px;
            border:1px solid rgba(255,255,255,.35);
            border-radius:999px;
            background:rgba(8,35,28,.42);
            color:#fff;
            text-decoration:none;
            font-size:11px;
            font-weight:700;
            backdrop-filter:blur(8px);
            transition:.25s;
        }

        .favorite-history-link:hover{
            background:#9a8252;
            border-color:#9a8252;
        }

        main{
            width:min(1100px,90%);
            margin:0 auto;
            padding:68px 0 100px;
        }

        .favorite-category{
            margin-bottom:68px;
        }

        .category-heading{
            display:flex;
            align-items:flex-end;
            justify-content:space-between;
            gap:20px;
            margin-bottom:22px;
            padding-bottom:16px;
            border-bottom:1px solid #ded9cc;
        }

        .category-heading-left small{
            display:block;
            margin-bottom:7px;
            color:#9a8252;
            font-size:9px;
            font-weight:700;
            letter-spacing:3px;
        }

        .category-heading h2{
            margin:0;
            color:#18392f;
            font-family:Georgia,serif;
            font-size:32px;
            font-weight:400;
        }

        .favorite-count{
            flex:0 0 auto;
            color:#7a817d;
            font-size:11px;
        }

        .favorite-grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:20px;
        }

        .favorite-card{
            background:#fff;
            cursor:pointer;
            border-radius:18px;
            padding:26px;
            box-shadow:0 12px 35px rgba(25,45,35,.07);
            transition:.25s;
            position:relative;
        }

        .favorite-card:hover{
            transform:translateY(-3px);
            box-shadow:0 18px 42px rgba(25,45,35,.11);
        }

        .favorite-card-type{
            display:inline-flex;
            padding:6px 10px;
            border-radius:999px;
            background:#f5f2e9;
            color:#9a8252;
            font-size:8px;
            font-weight:700;
            letter-spacing:2px;
        }

        .favorite-card h3{
            margin:12px 0 8px;
            padding-right:45px;
            color:#18392f;
            font-family:Georgia,serif;
            font-size:25px;
            font-weight:400;
            line-height:1.4;
        }

        .favorite-card-meta{
            color:#8a7560;
            font-size:10px;
            line-height:1.7;
            margin-bottom:12px;
        }

        .favorite-card-description{
            margin:0 0 18px;
            color:#68746e;
            font-size:12px;
            line-height:1.85;
        }        .favorite-card-actions{
            display:flex;
            flex-wrap:wrap;
            gap:8px;
        }

        .favorite-action{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            min-height:38px;
            padding:9px 13px;
            border-radius:8px;
            border:1px solid #d8cfbb;
            background:#fffdf8;
            color:#18392f;
            font-family:inherit;
            font-size:10px;
            font-weight:700;
            text-decoration:none;
            cursor:pointer;
            transition:.25s;
        }

        .favorite-action:hover{
            background:#18392f;
            border-color:#18392f;
            color:#fff;
        }

        .favorite-action.primary{
            background:#18392f;
            border-color:#18392f;
            color:#fff;
        }

        .favorite-action.primary:hover{
            background:#9a8252;
            border-color:#9a8252;
        }

        .favorite-action.remove{
            color:#8a7560;
        }

        .favorite-action.remove:hover{
            background:#f0e8d6;
            border-color:#9a8252;
            color:#6d5c36;
        }

        .empty-favorite{
            padding:28px;
            border:1px solid #ded9cc;
            border-radius:14px;
            background:#fffdf8;
            color:#68746e;
            font-size:12px;
            line-height:1.9;
        }

        .empty-favorite strong{
            display:block;
            margin-bottom:6px;
            color:#18392f;
            font-family:Georgia,serif;
            font-size:20px;
            font-weight:400;
        }

        /* =========================
           DETAIL MODAL
        ========================= */
        .detail-modal{
            position:fixed;
            inset:0;
            display:none;
            align-items:center;
            justify-content:center;
            padding:24px;
            background:rgba(8,25,20,.64);
            z-index:1000;
        }

        .detail-modal.is-open{
            display:flex;
        }

        .detail-modal-panel{
            width:min(760px,100%);
            max-height:min(88vh,920px);
            overflow:auto;
            padding:34px;
            border-radius:20px;
            background:#fff;
            box-shadow:0 30px 80px rgba(0,0,0,.25);
            position:relative;
        }

        .detail-close{
            position:absolute;
            top:18px;
            right:18px;
            width:38px;
            height:38px;
            padding:0;
            border:1px solid #d8cfbb;
            border-radius:50%;
            background:#fffdf8;
            color:#18392f;
            font-family:inherit;
            font-size:18px;
            cursor:pointer;
        }

        .detail-modal-label{
            margin-bottom:8px;
            color:#9a8252;
            font-size:9px;
            font-weight:700;
            letter-spacing:3px;
        }

        .detail-modal-title{
            margin:0 50px 10px 0;
            color:#18392f;
            font-family:Georgia,serif;
            font-size:38px;
            font-weight:400;
            line-height:1.35;
        }

        .detail-modal-area{
            margin-bottom:20px;
            color:#9a8252;
            font-size:11px;
        }

        .detail-modal-description{
            margin:0 0 22px;
            color:#68746e;
            font-size:13px;
            line-height:1.9;
        }

        .detail-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:10px;
            margin-bottom:22px;
        }

        .detail-box{
            padding:12px 14px;
            background:#f7f5ef;
            border-radius:9px;
        }

        .detail-box strong{
            display:block;
            margin-bottom:5px;
            color:#9a8252;
            font-size:8px;
            letter-spacing:1.5px;
        }

        .detail-box span{
            display:block;
            color:#59665f;
            font-size:11px;
            line-height:1.7;
            white-space:pre-line;
        }

        .detail-notes{
            margin:0 0 20px;
            color:#6a746f;
            font-size:11px;
            line-height:1.8;
        }

        .detail-actions{
            display:flex;
            flex-wrap:wrap;
            gap:9px;
        }

        footer{
            background:#0c211a;
            color:#fff;
            text-align:center;
            padding:60px 20px;
        }

        footer strong{
            font-family:Georgia,serif;
            font-size:28px;
            letter-spacing:7px;
        }

        footer p{
            margin:12px 0 0;
            color:#cdbd8c;
            font-size:9px;
            letter-spacing:4px;
        }

        @media(max-width:760px){
            .favorite-grid{
                grid-template-columns:1fr;
            }
        }

        @media(max-width:560px){
            .favorite-page-hero-inner,
            main{
                width:94%;
            }            .favorite-top-nav{
                top:16px;
                right:16px;
                gap:6px;
            }

            .favorite-top-nav .back-plan-link,
            .favorite-history-link{
                padding:9px 12px;
                font-size:10px;
            }

            .category-heading{
                align-items:flex-start;
                flex-direction:column;
                gap:7px;
            }

            .category-heading h2{
                font-size:28px;
            }

            .detail-modal-panel{
                padding:26px 20px;
            }

            .detail-grid{
                grid-template-columns:1fr;
            }

            .detail-modal-title{
                font-size:30px;
            }
        }
    </style>
</head>

<body>

<header class="favorite-page-hero">

    <div class="favorite-top-nav">
        <a href="/" class="back-plan-link" id="backToPlanLink">← 旅行プランに戻る</a>
        <a href="/history" class="favorite-history-link">▣ 旅行プラン履歴</a>
    </div>

    <div class="favorite-page-hero-inner">
        <div class="favorite-page-label">YOUR FAVORITES</div>
        <h1>♡ <span>お気に入り</span></h1>
        <p>
            あなたが保存した観光地・飲食店・宿泊施設をまとめて確認できます。<br>
            気になる場所を残して、自分だけの秩父旅行候補を作りましょう。
        </p>
    </div>
</header>

<main id="favoritesMain">

    <section class="favorite-category" data-category="観光地">
        <div class="category-heading">
            <div class="category-heading-left">
                <small>SPOTS</small>
                <h2>🏞 観光地</h2>
            </div>
            <div class="favorite-count" data-count-for="観光地">0件</div>
        </div>
        <div class="favorite-grid" data-grid-for="観光地"></div>
    </section>

    <section class="favorite-category" data-category="飲食店">
        <div class="category-heading">
            <div class="category-heading-left">
                <small>RESTAURANTS</small>
                <h2>🍴 飲食店</h2>
            </div>
            <div class="favorite-count" data-count-for="飲食店">0件</div>
        </div>
        <div class="favorite-grid" data-grid-for="飲食店"></div>
    </section>

    <section class="favorite-category" data-category="宿泊施設">
        <div class="category-heading">
            <div class="category-heading-left">
                <small>STAYS</small>
                <h2>🏨 宿泊施設</h2>
            </div>
            <div class="favorite-count" data-count-for="宿泊施設">0件</div>
        </div>
        <div class="favorite-grid" data-grid-for="宿泊施設"></div>
    </section>

</main>

<div class="detail-modal" id="detailModal" aria-hidden="true">
    <div class="detail-modal-panel" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
        <button type="button" class="detail-close" id="detailCloseButton" aria-label="閉じる">×</button>

        <div class="detail-modal-label" id="detailModalLabel"></div>
        <h2 class="detail-modal-title" id="detailModalTitle"></h2>
        <div class="detail-modal-area" id="detailModalArea"></div>
        <p class="detail-modal-description" id="detailModalDescription"></p>
        <div class="detail-grid" id="detailGrid"></div>
        <p class="detail-notes" id="detailModalNotes"></p>
        <div class="detail-actions" id="detailModalActions"></div>
    </div>
</div>

<footer>
    <strong>CHICHIBU</strong>
    <p>DISCOVER · EXPERIENCE · REMEMBER</p>
</footer>

<script id="favoriteCatalogData" type="application/json">{{ favorite_catalog | tojson }}</script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const STORAGE_KEY = "chichibuTravelFavoritesV1";
        const CATEGORIES = ["観光地", "飲食店", "宿泊施設"];

        const catalogElement = document.getElementById("favoriteCatalogData");
        let catalog = {};

        if (catalogElement) {
            try {
                catalog = JSON.parse(catalogElement.textContent || "{}");
            } catch (error) {
                console.error("お気に入りカタログの読み込みエラー:", error);
                catalog = {};
            }
        }

        const modal = document.getElementById("detailModal");
        const closeButton = document.getElementById("detailCloseButton");
        const modalLabel = document.getElementById("detailModalLabel");
        const modalTitle = document.getElementById("detailModalTitle");
        const modalArea = document.getElementById("detailModalArea");
        const modalDescription = document.getElementById("detailModalDescription");
        const detailGrid = document.getElementById("detailGrid");
        const modalNotes = document.getElementById("detailModalNotes");
        const modalActions = document.getElementById("detailModalActions");

        function readFavorites() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(parsed)) {
                    return [];
                }
                const unique = [];
                const seen = new Set();

                parsed.filter(function (item) {
                    return item && item.type && item.name;
                }).forEach(function (item) {
                    const key = favoriteKey(item);
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(item);
                    }
                });

                return unique;
            } catch (error) {
                console.error("お気に入り読み込みエラー:", error);
                return [];
            }
        }

        function writeFavorites(favorites) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
            } catch (error) {
                console.error("お気に入り保存エラー:", error);
            }
        }

        function favoriteKey(item) {
            return [
                item.type || "",
                item.name || "",
                item.address || ""
            ].join("|");
        }

        function findCatalogItem(favorite) {
            const items = Array.isArray(catalog[favorite.type]) ? catalog[favorite.type] : [];
            const exact = items.find(function (item) {
                return favoriteKey(item) === favoriteKey(favorite);
            });
            return exact || items.find(function (item) {
                return item.name === favorite.name;
            });
        }

        function escapeText(value) {
            return value === null || value === undefined ? "" : String(value);
        }

        function addDetailBox(label, value) {
            if (!value) {
                return;
            }
            const box = document.createElement("div");
            box.className = "detail-box";

            const strong = document.createElement("strong");
            strong.textContent = label;

            const span = document.createElement("span");
            span.textContent = value;

            box.appendChild(strong);
            box.appendChild(span);
            detailGrid.appendChild(box);
        }

        function openDetail(favorite, item) {            const data = item || favorite;

            modalLabel.textContent = data.type || favorite.type;
            modalTitle.textContent = data.name || favorite.name;
            modalArea.textContent = data.area || "";
            modalDescription.textContent = data.description || "施設の詳しい説明は登録データにありません。";

            detailGrid.innerHTML = "";
            addDetailBox("TYPE", data.category_detail);
            addDetailBox("ADDRESS", data.address);
            addDetailBox("PHONE", data.phone);
            addDetailBox("TRAIN", data.access && data.access.train);
            addDetailBox("BUS", data.access && data.access.bus);
            addDetailBox("WALK", data.access && data.access.walk);
            addDetailBox("CAR", data.access && data.access.car);
            addDetailBox("HOURS", data.hours);
            addDetailBox("PRICE", data.price);
            addDetailBox("CLOSED", data.closed);
            addDetailBox("PARKING", data.parking);
            addDetailBox("SEASON", data.season);
            addDetailBox("STAY TIME", data.time ? "約" + data.time + "時間" : "");
            addDetailBox("CAR FREE", data.car_free);
            addDetailBox("RESERVATION", data.required_reservation);

            modalNotes.textContent = data.notes || "";

            modalActions.innerHTML = "";

            if (data.url) {
                const official = document.createElement("a");
                official.className = "favorite-action primary";
                official.href = data.url;
                official.target = "_blank";
                official.rel = "noopener noreferrer";
                official.textContent = "公式サイト ↗";
                modalActions.appendChild(official);
            }

            if (data.map_url) {
                const maps = document.createElement("a");
                maps.className = "favorite-action";
                maps.href = data.map_url;
                maps.target = "_blank";
                maps.rel = "noopener noreferrer";
                maps.textContent = "Google Maps ↗";
                modalActions.appendChild(maps);
            }

            const favoriteButton = document.createElement("button");
            favoriteButton.type = "button";
            favoriteButton.className = "favorite-action remove";
            favoriteButton.textContent = "♥ お気に入り済み（解除）";
            favoriteButton.addEventListener("click", function () {
                removeFavorite(favorite);
                closeModal();
            });
            modalActions.appendChild(favoriteButton);

            modal.classList.add("is-open");
            modal.setAttribute("aria-hidden", "false");
        }

        function closeModal() {
            modal.classList.remove("is-open");
            modal.setAttribute("aria-hidden", "true");
        }

        function removeFavorite(favorite) {
            const key = favoriteKey(favorite);
            const updated = readFavorites().filter(function (item) {
                return favoriteKey(item) !== key;
            });
            writeFavorites(updated);
            renderFavorites();
        }

        function createCard(favorite, item) {
            const card = document.createElement("article");
            card.className = "favorite-card";

            const type = document.createElement("span");
            type.className = "favorite-card-type";
            type.textContent = favorite.type;

            const title = document.createElement("h3");
            title.textContent = favorite.name;

            const meta = document.createElement("div");
            meta.className = "favorite-card-meta";
            const area = item && item.area ? item.area : "";
            const address = item && item.address ? item.address : favorite.address || "";
            meta.textContent = [area, address].filter(Boolean).join(" ／ ");

            const description = document.createElement("p");
            description.className = "favorite-card-description";
            description.textContent = item && item.description
                ? item.description
                : "詳細情報を確認できます。";

            const actions = document.createElement("div");
            actions.className = "favorite-card-actions";

            const detailButton = document.createElement("button");
            detailButton.type = "button";
            detailButton.className = "favorite-action primary";
            detailButton.textContent = "詳細を見る";
            detailButton.addEventListener("click", function () {
                openDetail(favorite, item);
            });

            const removeButton = document.createElement("button");
            removeButton.type = "button";
            removeButton.className = "favorite-action remove";
            removeButton.textContent = "♥ お気に入り済み";
            removeButton.addEventListener("click", function () {
                removeFavorite(favorite);
            });

            actions.appendChild(detailButton);
            actions.appendChild(removeButton);

            if (item && item.map_url) {
                const mapButton = document.createElement("a");
                mapButton.className = "favorite-action";
                mapButton.href = item.map_url;
                mapButton.target = "_blank";
                mapButton.rel = "noopener noreferrer";
                mapButton.textContent = "Google Maps ↗";
                actions.appendChild(mapButton);
            }

            card.appendChild(type);
            card.appendChild(title);
            if (meta.textContent) {
                card.appendChild(meta);
            }
            card.appendChild(description);
            card.appendChild(actions);

            card.addEventListener("click", function (event) {
                if (event.target.closest(".favorite-action")) {
                    return;
                }
                openDetail(favorite, item);
            });

            return card;
        }

        function renderFavorites() {
            const favorites = readFavorites();

            CATEGORIES.forEach(function (category) {
                const section = document.querySelector('[data-category="' + category + '"]');
                const grid = document.querySelector('[data-grid-for="' + category + '"]');
                const count = document.querySelector('[data-count-for="' + category + '"]');

                if (!section || !grid || !count) {
                    return;
                }

                const categoryFavorites = favorites.filter(function (favorite) {
                    return favorite.type === category;
                });

                count.textContent = categoryFavorites.length + "件";
                grid.innerHTML = "";

                if (!categoryFavorites.length) {
                    const empty = document.createElement("div");
                    empty.className = "empty-favorite";
                    empty.style.gridColumn = "1 / -1";
                    empty.innerHTML = "<strong>お気に入りはまだありません。</strong>旅行プランの各施設にある♡お気に入りから追加してください。";
                    grid.appendChild(empty);
                    return;
                }

                categoryFavorites.forEach(function (favorite) {
                    const item = findCatalogItem(favorite);
                    grid.appendChild(createCard(favorite, item));
                });
            });
        }

        closeButton.addEventListener("click", closeModal);

        modal.addEventListener("click", function (event) {
            if (event.target === modal) {
                closeModal();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                closeModal();
            }
        });

        window.addEventListener("storage", function (event) {
            if (event.key === STORAGE_KEY) {
                renderFavorites();
            }
        });

        const backToPlanLink = document.getElementById("backToPlanLink");
        if (backToPlanLink && document.referrer.indexOf("/result") !== -1) {
            backToPlanLink.addEventListener("click", function (event) {
                event.preventDefault();
                history.back();
            });
        }

        renderFavorites();
    });
</script>

</body>
</html>
